services:
  geopredict-api:
    build:
      context: .
    environment:
      PYTHONUNBUFFERED: "1"
      GEOPREDICT_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      GEOPREDICT_OSM_CACHE_DIR: "/tmp/geopredict-osm-cache"
    ports:
      - "8000:8000"
    volumes:
      - geopredict_osm_cache:/tmp/geopredict-osm-cache
    restart: unless-stopped

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-app:
    build:
      context: ../express-auth-service
    environment:
      NODE_ENV: development
      PORT: "8001"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: auth-db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-postgres}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    ports:
      - "8001:8001"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  geo-mark-front:
    build:
      context: ../geo_mark_front
      args:
        API_BASE_URL: auto
        AUTH_API_URL: auto
    environment:
      API_BASE_URL: auto
      AUTH_API_URL: auto
    ports:
      - "3000:3000"
    depends_on:
      - geopredict-api
      - auth-app
    restart: unless-stopped

volumes:
  auth_postgres_data:
  geopredict_osm_cache:
